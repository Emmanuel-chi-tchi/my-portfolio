<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#050508"><title>Emmanuel Chi | Contact</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../pages.css"><script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js" defer></script><script type="module" src="../script.js"></script></head>
<body data-page="contact" data-root="../">
  <div data-site-header></div>

          <label for="contact-service">Service:<select id="contact-service" name="service"><option value="" selected>Select service (optional)</option><option>Web Design</option><option>Web Development</option><option>UI/UX</option><option>Graphic Design</option><option>Branding</option><option>Digital Marketing</option><option>Video Editing</option></select></label>
        </div>
        <label class="message-field" for="contact-message">Your message:<textarea id="contact-message" name="message" placeholder="Tell me about your project or requirements...." required></textarea></label>
        <div class="contact-lower"><div class="follow-block"><h2>Follow Me.</h2><div class="contact-socials" aria-label="Social profiles" data-contact-socials></div></div>
        <address class="contact-details"><div><span class="contact-icon email-contact-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3z"/><path d="m3 6 9 7 9-7"/></svg></span><span><b>Email:</b><br>emmanuelchi655@gmail.com</span></div><a href="https://wa.me/237670636457?text=Welcome%20to%20Emmanuel%27s%20Graphics%20Hub!%20Thanks%20for%20contacting%20us.%20How%20can%20I%20help%20you%20today%3F" target="_blank" rel="noopener noreferrer" aria-label="Message Emmanuel on WhatsApp"><span class="contact-icon whatsapp-contact-icon" data-brand-icon="whatsapp" aria-hidden="true"></span><span>670636457</span></a><a class="facebook-name" href="https://www.facebook.com/profile.php?id=61594172756204" target="_blank" rel="noopener noreferrer"><span class="contact-icon facebook-contact-icon" data-brand-icon="facebook" aria-hidden="true"></span><b>Emmanuel Tchi</b></a></address></div>
        <button class="submit-button" type="submit">Submit</button>
        <p class="form-status" data-form-status aria-live="polite" hidden></p>
      </form>
    </section>
  </main>
  <div data-site-footer></div>
</body>
</html>
